name: Build C99 mode

on:
  push:
  release:
    types: [published]

permissions:
  contents: read

# A new push to a branch cancels the runs for the previous commit. Runs on
# master and for releases always complete.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' && github.event_name != 'release' }}

jobs:
  build-and-test:
    timeout-minutes: 20
    name: Build
    runs-on: "ubuntu-24.04"

    steps:
      - name: Install compiler
        run: sudo apt update && sudo apt install -y build-essential cmake git ninja-build
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Build
        run: cmake --workflow --preset "test_ansi_c99"
