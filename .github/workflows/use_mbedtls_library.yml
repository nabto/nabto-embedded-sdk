name: Use MbedTLS as a Library

on:
  push:
  release:
    types: [ published ]

permissions:
  contents: read

# A new push to a branch cancels the runs for the previous commit. Runs on
# master and for releases always complete.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' && github.event_name != 'release' }}

jobs:
  build-and-test:
    timeout-minutes: 20
    name: Build
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 0

    - name: build
      run: mkdir build && cd build && ../test/mbedtls_as_library/build.sh
