name: Check code

on:
  push:
  release:
    types: [published]

permissions:
  contents: read

# A new push to a branch cancels the runs for the previous commit. Runs on
# master and for releases always complete.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' && github.event_name != 'release' }}

jobs:
  build-and-test:
    timeout-minutes: 20
    name: Build
    runs-on: ${{matrix.os}}
    strategy:
      matrix:
        include:
          - os: ubuntu-24.04
            workflow: werror
          - os: ubuntu-24.04
            workflow: clang_tidy
          - os: macos-15
            workflow: werror
          - os: windows-2022
            workflow: "windows_werror"

    steps:
      - if: matrix.workflow.os == 'ubuntu-24.04'
        name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build build-essential cmake git

      - if: matrix.workflow.os == 'macos-15'
        name: Install Ninja
        run: brew install ninja
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - name: vcpkg binary cache
        uses: ./.github/actions/vcpkg-cache
        with:
          name: ${{ matrix.workflow }}
      - name: Build
        run: cmake --workflow --preset ${{matrix.workflow}}
