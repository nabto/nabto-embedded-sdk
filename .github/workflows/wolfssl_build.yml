name: Wolfssl Build

on:
  push:
  release:
    types: [ published ]

permissions:
  contents: read

# A new push to a branch cancels the runs for the previous commit. Runs on
# master and for releases always complete.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' && github.event_name != 'release' }}

jobs:
  build-and-test:
    timeout-minutes: 20
    name: Build
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        cli-only: [0, 1]

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 0

    # wolfSSL is installed into a staging directory which is cached, the key
    # changes with this file, so changing the version or the configure flags
    # below builds it again.
    - name: Restore wolfssl
      id: wolfssl-cache
      uses: actions/cache@v4
      with:
        path: ${{ runner.temp }}/wolfssl-install
        key: wolfssl-v5.5.1-stable-${{ runner.os }}-ubuntu-22.04-${{ hashFiles('.github/workflows/wolfssl_build.yml') }}

    - name: prepare wolfssl
      if: steps.wolfssl-cache.outputs.cache-hit != 'true'
      run: mkdir ${{ runner.temp }}/wolfssl-build && cd ${{ runner.temp }}/wolfssl-build && curl -sSL https://github.com/wolfSSL/wolfssl/archive/refs/tags/v5.5.1-stable.tar.gz | tar -xzf - --strip-components=1

    - name: configure wolfssl
      if: steps.wolfssl-cache.outputs.cache-hit != 'true'
      run: cd ${{ runner.temp }}/wolfssl-build && ./autogen.sh && ./configure --prefix=/usr --enable-ecc --enable-dsa --enable-dtls --enable-dtls-mtu --enable-aesccm --enable-alpn --enable-debug --enable-certgen --enable-keygen --enable-harden --enable-sni --enable-sp-math-all=small CFLAGS="-DKEEP_PEER_CERT -DWOLFSSL_PUBLIC_MP -DWOLFSSL_PUBLIC_ECC_ADD_DBL"

    - name: build wolfssl
      if: steps.wolfssl-cache.outputs.cache-hit != 'true'
      run: cd ${{ runner.temp }}/wolfssl-build && make -j 8 && ./wolfcrypt/benchmark/benchmark -ecc && make install DESTDIR=${{ runner.temp }}/wolfssl-install

    - name: install wolfssl
      run: sudo cp -a ${{ runner.temp }}/wolfssl-install/usr/. /usr/ && sudo ldconfig

    - name: Configure cmake
      run: mkdir build-dir && cd build-dir && cmake -DCMAKE_INSTALL_PREFIX=${{ github.workspace }}/artifacts -DNABTO_DEVICE_WOLFSSL=1 -DDEVICE_BUILD_TESTS=ON -DNABTO_DEVICE_DTLS_CLIENT_ONLY=${{ matrix.cli-only }} ..

    - name: Build
      run: cmake --build build-dir --parallel

    - name: Install
      run: cmake --build build-dir --target install

    - name: Test run
      run: ${{ github.workspace }}/artifacts/bin/embedded_unit_test -l test_suite --detect_memory_leaks=0
