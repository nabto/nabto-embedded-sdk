name: Build Release Artifacts

on:
  push:
  release:
    types: [published]

jobs:
  build:
    strategy:
      matrix:
        os: [windows-2022, macos-15]
        include:
          - os: windows-2022
            exe_postfix: .zip
            friendly_name: windows
            workflow: windows_vcpkg_static
          - os: macos-15
            workflow: mac_fetchcontent_universal
            exe_postfix:
            friendly_name: macos
    name: Build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      # Temporarily ping CMake version to 3.31 (see #47)
      - name: Install cmake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: '3.31.x'

      - name: Export GitHub Actions cache environment variables
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - if: matrix.os == 'macos-15'
        name: Install Ninja
        run: brew install ninja

      - name: Build
        env:
          VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
        run: cmake --workflow --preset ${{matrix.workflow}}

      - if: matrix.os != 'windows-2022'
        name: Prepare assets
        run: |
          mkdir -p ${{ github.workspace }}/artifacts/bin
          mv ${{ github.workspace }}/build/${{ matrix.workflow }}/install/bin/tcp_tunnel_device ${{ github.workspace }}/artifacts/bin/tcp_tunnel_device_${{matrix.friendly_name}}
          mv ${{ github.workspace }}/build/${{matrix.workflow}}/install/bin/thermostat_device ${{ github.workspace }}/artifacts/bin/thermostat_device_${{matrix.friendly_name}}

      - if: matrix.os == 'windows-2022'
        name: Prepare assets windows
        run: |
          mkdir -p ${{ github.workspace }}/release-tunnel
          mkdir -p ${{ github.workspace }}/artifacts/bin
          mv ${{ github.workspace }}/build/${{ matrix.workflow }}/install/bin/tcp_tunnel_device.exe ${{ github.workspace }}/release-tunnel/tcp_tunnel_device_windows.exe
          cp ${{ github.workspace }}/build/${{ matrix.workflow }}/install/bin/*.dll ${{ github.workspace }}/release-tunnel/
          Compress-Archive -Path ${{ github.workspace }}/release-tunnel/* -Destination ${{ github.workspace }}/artifacts/bin/tcp_tunnel_device_windows.zip
          mkdir -p ${{ github.workspace }}/release-thermostat
          mv ${{ github.workspace }}/build/${{ matrix.workflow }}/install/bin/thermostat_device.exe ${{ github.workspace }}/release-thermostat/thermostat_device_${{matrix.friendly_name}}.exe
          cp ${{ github.workspace }}/build/${{ matrix.workflow }}/install/bin/*.dll ${{ github.workspace }}/release-thermostat/
          Compress-Archive -Path ${{ github.workspace }}/release-thermostat/* -Destination ${{ github.workspace }}/artifacts/bin/thermostat_device_windows.zip

      - name: Upload artifacts to github actions workspace artifacts
        if: ${{ success() }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.friendly_name }}

          path: |
            ${{ github.workspace }}/artifacts/bin/tcp_tunnel_device_${{matrix.friendly_name}}${{ matrix.exe_postfix }}
            ${{ github.workspace }}/artifacts/bin/thermostat_device_${{matrix.friendly_name}}${{ matrix.exe_postfix }}
          if-no-files-found: error
          overwrite: true

  # Every released linux binary is built by build-scripts/linux.sh, using the
  # pinned bootlin glibc 2.34 cross toolchains. This is the same command a
  # developer runs locally, so the released binaries are reproducible.
  #
  # friendly_name preserves the historical release asset names: the arm64 target
  # is published as linux_aarch64 and the armv7 target as linux_armhf.
  build-linux:
    # Cross building the vcpkg dependencies (boost in particular) for four
    # architectures needs more than the 20 minutes the other jobs use, at least
    # until the vcpkg binary cache is warm.
    timeout-minutes: 60
    strategy:
      matrix:
        include:
          - target: linux_x86_64
            friendly_name: linux_x86_64
          - target: linux_arm64
            friendly_name: linux_aarch64
          - target: linux_armv6
            friendly_name: linux_armv6
          - target: linux_armv7
            friendly_name: linux_armhf
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 0

    # Temporarily ping CMake version to 3.31 (see #47)
    - name: Install cmake
      uses: jwlawson/actions-setup-cmake@v2
      with:
        cmake-version: '3.31.x'

    - name: Install Ninja
      run: sudo apt-get update && sudo apt-get install -y ninja-build

    - name: Export GitHub Actions cache environment variables
      uses: actions/github-script@v7
      with:
        script: |
          core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
          core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

    # Downloads and relocates the toolchain, configures, builds, installs and
    # prints the resulting architecture. For linux_x86_64 it also runs the unit
    # tests, since those binaries run on the build host.
    - name: Build
      env:
        VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
      run: ./build-scripts/linux.sh ${{ matrix.target }}

    - name: Prepare assets
      run: |
        mkdir -p ${{ github.workspace }}/artifacts/bin
        mv ${{ github.workspace }}/build/${{ matrix.target }}/install/bin/tcp_tunnel_device ${{ github.workspace }}/artifacts/bin/tcp_tunnel_device_${{ matrix.friendly_name }}
        mv ${{ github.workspace }}/build/${{ matrix.target }}/install/bin/thermostat_device ${{ github.workspace }}/artifacts/bin/thermostat_device_${{ matrix.friendly_name }}

    - name: Upload artifacts
      if: ${{ success() }}
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.friendly_name }}
        path: |
          ${{ github.workspace }}/artifacts/bin/tcp_tunnel_device_${{ matrix.friendly_name }}
          ${{ github.workspace }}/artifacts/bin/thermostat_device_${{ matrix.friendly_name }}
        if-no-files-found: error
        overwrite: true


  upload-artifacts:
    timeout-minutes: 20
    strategy:
      matrix:
        friendly_name: [linux_x86_64, linux_armv6, linux_armhf, linux_aarch64, windows, macos]
        binary: [tcp_tunnel_device, thermostat_device]
        include:
          - file_suffix: .zip
            friendly_name: windows

    name: Release Assets
    needs: [ build, build-linux ]
    runs-on: ubuntu-22.04
    permissions:
      # give access to upload an artifacts to gh releases
      contents: write

    if: github.event_name == 'release'
    steps:
      - name: download artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./
      - name: list files
        run: ls -R
      - name: Upload Source Asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ github.event.release.upload_url }}
          asset_path: ./${{matrix.friendly_name}}/${{matrix.binary}}_${{matrix.friendly_name}}${{matrix.file_suffix}}
          asset_name: ${{matrix.binary}}_${{matrix.friendly_name}}${{matrix.file_suffix}}
          asset_content_type: application/octet-stream
