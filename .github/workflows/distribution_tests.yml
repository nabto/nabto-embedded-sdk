name: Distribution tests

on:
  push:

permissions:
  contents: read

# A new push to a branch cancels the runs for the previous commit. Runs on
# master and for releases always complete.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' && github.event_name != 'release' }}

jobs:
  build-and-test:
    timeout-minutes: 20
    name: Build
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        distribution_test: [cmake_fetchcontent, cmake_find_package, direct_link_gcc, vcpkg_example]

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - name: build
        run: ./test/distribution/${{ matrix.distribution_test }}/build.sh
